name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      # Login + push only happen when DEPLOY_ENABLED=true.
      # Otherwise the job builds the images locally to validate the
      # Dockerfiles and exits green — a "dry run."
      - uses: docker/login-action@v4

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |

            ${{ vars.DOCKERHUB_USERNAME }}/Skillpulse-backend:latest
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |

           ${{ secrets.DOCKERHUB_TOKEN }}/Skillpulse-frontend:latest

